# Static site — no build step needed. Netlify serves this folder as-is.
[build]
  publish = "."

# The message wall runs as a small serverless function
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Photos, videos, music and libraries rarely change → cache them for a week
[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/music/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The locked folder file must never be cached by the browser (so new photos show up)
[[headers]]
  for = "/assets/private/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
